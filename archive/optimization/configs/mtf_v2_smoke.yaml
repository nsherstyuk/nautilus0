system:
  name: mtf_v2
  runner: backtest/run_backtest_mtf_v2_sweep.py

optimization:
  objective: sharpe_ratio
  workers: 1
  checkpoint_interval: 1
  checkpoint_file: optimization/results/mtf_v2_smoke_checkpoint.csv
  output_file: optimization/results/mtf_v2_smoke_results.csv
  timeout_seconds: 1200

parameters:
  prediction_threshold:
    values: [0.55, 0.70]

fixed:
  total_position_size: 100000
  pos1_fraction: 0.85
  pos2_fraction: 0.15
  pos3_fraction: 0.0
  sl_atr_mult: 1.4
  pos1_tp_atr_mult: 0.6
  pos2_tp_atr_mult: 1.5
  pos3_tp_atr_mult: 1.5
  trailing_activation_atr_mult: 0.6
  trailing_distance_atr_mult: 0.4
  trade_start_hour: 0
  trade_end_hour: 24
  min_atr: 0.0003
  max_atr: 0.005
  stall_detection_enabled: true
  stall_check_bars: 6
  stall_min_profit_atr: 0.2
  stall_sl_atr: 0.2
  backtest_start: "2025-01-01"
  backtest_end: "2025-03-01"
  initial_balance: 50000
