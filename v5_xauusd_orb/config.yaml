# ============================================================
#  XAUUSD Asian Range -> London Breakout  (v5)
#  All configurable parameters in one place.
# ============================================================

# ── Strategy ─────────────────────────────────────────────────
strategy:
  # Asian range definition (UTC hours)
  asian_start_hour: 0        # range begins (inclusive)
  asian_end_hour: 6          # range ends (exclusive)

  # London trade window (UTC hours)
  trade_start_hour: 8        # place bracket orders
  trade_end_hour: 16         # cancel unfilled / close position

  # Reward-to-risk ratio  (TP distance = RR * range_size)
  rr_ratio: 2.0

  # Asian range filters  (skip day if range % of price is outside bounds)
  min_range_pct: 0.05        # too tight -> skip
  max_range_pct: 2.0         # too wide  -> skip

  # Weekdays to skip (0=Mon … 6=Sun).
  # From seasonality analysis: Wednesday (2) has near-zero edge.
  skip_weekdays: [2]         # [] to trade every weekday

  # Breakeven stop rule: move SL to entry + offset after N hours in trade
  # Validated via sensitivity analysis with realistic slippage ($0.15) + spread ($0.10)
  # 120min: P&L $+2,758  Sharpe 4.28  PF 3.31  MaxDD -$36  (corrected cost model)
  # Neighbors (90min/no-BE) perform similarly -> not overfitted
  be_hours: 2                 # 2h breakeven trigger (was 1h; 2h gives trades more room)
  be_offset_usd: 2.0          # move SL to entry + $2 (covers spread+slippage costs)

  # Poll interval inside the main event loop (seconds)
  poll_interval: 10

# ── Position sizing ──────────────────────────────────────────
position:
  qty: 1                     # default size in oz (1 oz = micro lot)
  # max_risk_usd: 50         # (future) cap risk in dollars per trade

# ── IBKR connection ─────────────────────────────────────────
ibkr:
  host: "127.0.0.1"
  port: 4002                 # 7497 = TWS paper, 4002 = Gateway paper, 4001 = Gateway live
  client_id: 60

  # Contract definition
  symbol: "XAUUSD"
  sec_type: "CMDTY"          # CMDTY (London Gold) -- CFDs blocked for Canadian residents
  exchange: "SMART"
  currency: "USD"

  # Reconnect behaviour
  max_retries: 10
  base_backoff_sec: 5
  max_backoff_sec: 300       # 5 minutes
  heartbeat_interval_sec: 30
  connect_timeout_sec: 20

# ── IB Gateway process manager ──────────────────────────────
gateway:
  exe_path: "C:\\Jts\\ibgateway\\1041\\ibgateway.exe"
  process_name: "ibgateway.exe"
  paper_port: 4002
  live_port: 4001
  check_interval_sec: 60     # health-check frequency
  startup_wait_sec: 60       # wait for API after launch
  restart_cooldown_sec: 300  # min gap between restarts
  port_check_timeout_sec: 5
  max_consecutive_port_failures: 3

# ── Paths ────────────────────────────────────────────────────
paths:
  tick_bar_file: "trading_system_v4/data/xauusd_1000t_bars.parquet"
  log_dir: "v5_xauusd_orb/logs"
  state_dir: "v5_xauusd_orb/state"
  trade_log: "v5_xauusd_orb/logs/xauusd_orb_trades.csv"
  ibgw_log: "v5_xauusd_orb/logs/ibgw_manager.log"
  live_log: "v5_xauusd_orb/logs/xauusd_orb_live.log"

# ── Multi-instrument ORB configs ──────────────────────────────
# Each instrument has its own session times, costs, and contract.
# Used by orb_multi_live.py; single-instrument orb_live.py uses
# the legacy 'strategy' section above.
instruments:
  XAUUSD:
    enabled: true
    # IB contract
    symbol: "XAUUSD"
    sec_type: "CMDTY"
    exchange: "SMART"
    currency: "USD"
    # Session times (UTC hours)
    asian_start_hour: 0
    asian_end_hour: 6
    trade_start_hour: 8       # London session
    trade_end_hour: 16
    # Strategy
    rr_ratio: 2.0
    min_range_pct: 0.05
    max_range_pct: 2.0
    skip_weekdays: [2]
    be_hours: 2
    be_offset: 2.0            # $2 offset for Gold (covers ~$0.50 round-trip costs)
    max_pending_hours: 4      # cancel unfilled entry after 4h (backtested: improves Sharpe, cuts DD)
    qty: 1                    # 1 oz
    # Display
    price_decimals: 2
    pip_label: "$"

  EURUSD:
    enabled: true
    # IB contract
    symbol: "EUR"
    sec_type: "CASH"
    exchange: "IDEALPRO"
    currency: "USD"
    # Session times (UTC hours)
    asian_start_hour: 0
    asian_end_hour: 6
    trade_start_hour: 7       # London session (matches backtest)
    trade_end_hour: 16
    # Strategy
    rr_ratio: 2.0
    min_range_pct: 0.01
    max_range_pct: 2.0
    skip_weekdays: []          # all weekdays profitable for EURUSD
    be_hours: 2
    be_offset: 0.0002         # 2 pips offset (covers ~1.6 pips round-trip costs)
    max_pending_hours: 4      # cancel unfilled entry after 4h (backtested: improves Sharpe, cuts DD)
    qty: 20000                # 20k units (mini lot = $2/pip)
    # Display
    price_decimals: 5
    pip_label: "pip"

# ── Signal script ────────────────────────────────────────────
signal:
  history_days: 30           # how many recent days to show
